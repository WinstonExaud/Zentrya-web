<!doctype html>
<html lang="en">
  <head>
    <!-- ================= BASIC ================= -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Zentrya Tv</title>

    <!-- ================= BRAND / THEME ================= -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ================= SEO ================= -->
    <meta
      name="description"
      content="Stream the best African movies, series, and originals on Zentrya. Premium entertainment from Tanzania and East Africa."
    />
    <meta
      name="keywords"
      content="Zentrya, African movies, Tanzanian entertainment, streaming, Bongo movies, East African series, originals"
    />
    <meta name="author" content="Zentrya" />
    <meta name="robots" content="index, follow" />

    <!-- ================= OPEN GRAPH ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tv.zentrya.africa/" />
    <meta property="og:title" content="Zentrya Tv" />
    <meta
      property="og:description"
      content="Stream the best African movies, series, and originals on Zentrya."
    />
    <meta property="og:image" content="/zentrya-icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- ================= TWITTER ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zentrya | Your World of African Stories" />
    <meta
      name="twitter:description"
      content="Stream the best African movies, series, and originals on Zentrya."
    />
    <meta name="twitter:image" content="/Z.png" />

    <!-- ================= FONTS ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- ================= FAVICONS ================= -->
    <!-- Browser -->
    <link rel="icon" type="image/png" sizes="16x16" href="/zentrya-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/zentrya-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/zentrya-icon.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="/zentrya-icon.png" />

    <!-- Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="/zentrya-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/zentrya-icon.png" />
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ================= GLOBAL STYLES ================= -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: #000000;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #000;
      }

      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #d4af37;
      }

      ::selection {
        background-color: #d4af37;
        color: #000;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
